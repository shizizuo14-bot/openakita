# OpenAkita security policy (Policy V2 schema).
# Migrated from the v1 layout generated by `openakita init` so that the
# loader no longer has to run the legacy migration (and log warnings) on
# every start. Behaviour is unchanged — verified by comparing the fully
# resolved PolicyConfigV2 against the pre-migration file.

security:
  enabled: true
  sandbox:
    enabled: false
    backend: auto
    sandbox_risk_levels:
    - HIGH
    exempt_commands: []
    network_allow_in_sandbox: false
    network_allowed_domains: []
  checkpoint:
    enabled: true
    max_snapshots: 50
    snapshot_dir: data/checkpoints
  profile:
    current: trust
    base: null
  death_switch:
    enabled: true
    threshold: 3
    total_multiplier: 3
  confirmation:
    mode: trust
    timeout_seconds: 60
    default_on_timeout: deny
    confirm_ttl: 120.0
  shell_risk:
    enabled: true
  user_allowlist:
    commands: []
    tools: []
  workspace:
    paths:
    - ${CWD}
  safety_immune:
    paths:
    - C:/Program Files/**
    - C:/Program Files (x86)/**
    - C:/Windows/**
    - C:/ProgramData/**
    - /usr/**
    - /bin/**
    - /sbin/**
    - /lib/**
    - /lib64/**
    - /boot/**
    - /etc/**
    - /dev/**
    - /proc/**
    - /sys/**
    - /System/**
    - /Library/**
    - ~/.ssh/**
    - ~/.gnupg/**
    - C:/Windows/System32/config/**
    - /etc/shadow
    - /etc/gshadow
  audit:
    enabled: true
    log_path: data/audit/policy_decisions.jsonl
